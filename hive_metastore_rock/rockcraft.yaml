name: hive-metastore
base: ubuntu@24.04
version: '3.1.3'
summary: "Apache Hive Metastore 3.1.3 Rock"
description: "OCI image for Hive Metastore service."
platforms:
    amd64:

parts:
  # ---- Base Packages ----
  base-packages:
    plugin: nil
    overlay-packages:
      - curl
      - vim
  
  # ---- Java Runtime ----
  java:
    plugin: nil
    overlay-packages:
      - openjdk-8-jre-headless

  # ---- Hadoop Binaries (Required by Hive) ----
  hadoop:
    plugin: dump
    source: ./hadoop-3.3.4
    # source: https://archive.apache.org/dist/hadoop/common/hadoop-3.3.4/hadoop-3.3.4.tar.gz
    # source-checksum: sha512/c0f930e1f3131751b5b4e3661c96b761a5e176156e50f00f023f4c6e91b619f798363c8705c879d6313a078c13b2c611593c78f1351119b22e16d860e3a6a16b
    organize:
      "*": opt/hadoop/
    stage:
      - opt/hadoop

  # ---- Hive Metastore ----
  hive:
    plugin: dump
    source: ./apache-hive-3.1.3-bin
    # source: https://archive.apache.org/dist/hive/hive-3.1.3/apache-hive-3.1.3-bin.tar.gz
    # source-checksum: sha512/d72f0962b10a2f4c08e5bdbe5070014d5e97c67e91d101b0b306b3f7d73f1d2ea31e11d041a6b7d3f666f363efa515a0c3098f98f1f108f01c83d23fe11816e8
    organize:
      "*": opt/hive/
    stage:
      - opt/hive

  # ---- PostgreSQL JDBC Driver ----
  postgres-jdbc:
    after:
      - hive
    plugin: dump
    source: ./postgresql-42.7.3.jar
    # source: https://jdbc.postgresql.org/download/postgresql-42.7.3.jar
    # source-checksum: sha512/2c668b5aa0e61d8f76d8b6c433c698ce85e6b4e5d808a68b50ea80b3955b25f48364e72390c9b01fba9df1b3b190c1f6c4c0b490f2302b54d24a0d91a9b24053
    source-type: file
    organize:
      "postgresql-42.7.3.jar": opt/hive/lib/postgresql-42.7.3.jar
    stage:
      - opt/hive/lib/postgresql-42.7.3.jar

# ---- Service Definition ----
services:
  hive-metastore:
    override: replace
    command: "/opt/hive/bin/hive --service metastore"
    startup: enabled
    environment:
      HIVE_HOME: "/opt/hive"
      HADOOP_HOME: "/opt/hadoop"
      JAVA_HOME: "/usr/lib/jvm/java-8-openjdk-amd64"
      # Tell Hive/Hadoop to look for config in this dir,
      # which is where the charm will mount its configuration.
      HIVE_CONF_DIR: "/etc/hive-conf"
      HADOOP_CONF_DIR: "/etc/hive-conf"
      PATH: "/opt/hadoop/bin:/opt/hive/bin:$PATH"
