name: Publish to edge

on:
  push:
    branches:
      - main

jobs:
  publish:
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@main
    secrets: inherit
    with:
      channel: latest/edge
      resource-mapping: '{"hive-metastore": "hive-metastore-image"}'
