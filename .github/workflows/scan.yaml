name: Scans
on:
  pull_request:
jobs:
  scan_hive:
    name: Scan Apache Hive
    runs-on: ubuntu-24.04
    steps:
      - name: Run Trivy on 3.1.3
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: 'docker.io/apache/hive:3.1.3'
          format: 'table'
          severity: CRITICAL,HIGH
      - name: Run Trivy on 4.1.0
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: 'docker.io/apache/hive:standalone-metastore-4.1.0'
          format: 'table'
          severity: CRITICAL,HIGH
      - name: Run Trivy on 4.2.0
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: 'docker.io/apache/hive:standalone-metastore-4.2.0'
          format: 'table'
          severity: CRITICAL,HIGH
          