[project]
name = "hive-metastore-k8s-operator"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "ops>=3.4.0,<4",
]

[dependency-groups]
# Dependencies for PYDEPS of charm libraries
charmlibs-pydeps = [
    "ops>=2.0.0",
    "pydantic>=1.10,<2",
]

# Dependencies for linting and type checks
lint = [
    "ruff",
    "codespell",
    "pyright",
]

# Dependencies for static analysis
static = [
    "bandit[toml]",
]

# Dependencies for unit tests
unit = [
    "coverage[toml]",
    "ops[testing]",
    "pytest",
]

# Dependencies for integration tests
integration = [
    "jubilant",
    "pydantic",
    "pytest",
    "pytest-operator",
]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Linting tools configuration
[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.extend-ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
extend-exclude = ["__pycache__", "*.egg_info"]
lint.per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"]}

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage"

[tool.pyright]
include = ["src/**.py"]
extraPaths = ["lib"]  # get language server for libs
