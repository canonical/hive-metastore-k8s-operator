[tox]
no_package = True
skip_missing_interpreters = True
env_list = format, lint, static, unit, coverage-report
min_version = 4.0.0

[vars]
src_path = {tox_root}/src
tests_path = {tox_root}/tests
;lib_path = {tox_root}/lib/charms/operator_name_with_underscores
all_path = {[vars]src_path} {[vars]tests_path}

[testenv]
runner = uv-venv-runner
set_env =
    PYTHONPATH = {tox_root}/lib:{[vars]src_path}
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
pass_env =
    PYTHONPATH
    CHARM_BUILD_DIR
    MODEL_SETTINGS

[testenv:format]
description = Apply coding style standards to code
dependency_groups = lint
commands =
    ruff format {[vars]all_path}
    ruff check --fix {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards
dependency_groups = lint
commands =
    # if this charm owns a lib, uncomment "lib_path" variable
    # and uncomment the following line
    # codespell {[vars]lib_path}
    codespell {tox_root}
    ruff check {[vars]all_path}
    ruff format --check --diff {[vars]all_path}

[testenv:unit]
description = Run unit tests
deps =
    -r pyproject.toml
dependency_groups = unit
commands =
    coverage run --source={[vars]src_path} \
                 -m pytest \
                 --tb native \
                 -vv \
                 -s \
                 {posargs} \
                 {[vars]tests_path}/unit
    coverage report

# `operator-workflows/test.yaml` expects this target.
[testenv:coverage-report]
description = Create test coverage report
depends = unit
deps =
    -r pyproject.toml
dependency_groups = unit
commands =
    coverage report

[testenv:static]
description = Run static type checks
deps =
    -r pyproject.toml
dependency_groups = lint
commands =
    pyright {posargs}

[testenv:integration]
description = Run integration tests
runner = uv-venv-lock-runner
pass_env =
    CHARM_PATH
dependency_groups = integration
commands =
    pytest -v \
           -s \
           --tb native \
           --log-cli-level=INFO \
           {posargs} \
           {[vars]tests_path}/integration
