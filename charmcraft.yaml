# This file configures Charmcraft.
# See https://canonical-charmcraft.readthedocs-hosted.com/en/stable/reference/files/charmcraft-yaml-file/
type: charm
name: hive-metastore-k8s
title: Hive Metastore K8s Operator
summary: Deploy and configure the Apache Hive Metastore on Kubernetes.
description: |
  The Hive Metastore K8s Operator deploys the Hive Metastore using a pre-built
  Hive Metastore rock and integrates with a charmed PostgreSQL database.
  It is designed for integrating with Trino that rely on Hive-compatible metadata
  services running on Kubernetes for certain use cases.

base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    plugin: uv
    source: .
    uv-groups:
      - charmlibs-pydeps
    build-snaps:
      - astral-uv

charm-libs:
  - lib: data_platform_libs.data_interfaces
    version: "0"
  - lib: data_platform_libs.data_models
    version: "0"  

config:
  options:
    additional-jvm-options:
      type: string
      default: ""
      description: |
        Additional options to tune JVM.
        Format: A string of constructed as if calling `java` with them.
        Example: "-Xmx2g -Xms256m"
    # https://cwiki.apache.org/confluence/pages/viewpage.action?pageId=27842758#ConfigurationProperties-hive.metastore.server.min.threads
    hms-min-threads:
      type: int
      default: 200
      description: Minimum number of threads for the Hive Metastore service.
    # https://cwiki.apache.org/confluence/pages/viewpage.action?pageId=27842758#ConfigurationProperties-hive.metastore.server.min.threads
    hms-max-threads:
      type: int
      default: 1000
      description: Maximum number of threads for the Hive Metastore service.
    kubernetes-requests:
      type: string
      default: ""
      description: |
        Custom resource requests for the Hive Metastore container.
        Format: Comma separated key=value pairs of 'cpu' and 'memory'.
        Example: "cpu=100m,memory=256Mi".
    kubernetes-limits:
      type: string
      default: ""
      description: |
        Custom resource limits for the Hive Metastore container.
        Format: Comma separated key=value pairs of 'cpu' and 'memory'.
        Example: "cpu=500m,memory=1Gi".
    # https://cwiki.apache.org/confluence/pages/viewpage.action?pageId=27842758#ConfigurationProperties-datanucleus.connectionPoolingType
    sql-connection-pool-max-size:
      type: int
      default: 10
      description: Maximum size of the SQL connection pool to the backend database.

# To be implemented later.
# actions:
#   clear-init-flag:
#     description: Clear the initialization flag to recover from a broken state.
# 
#   restart:
#     description: Restart the Hive Metastore service.
# 
#   restore-schema-dirs:
#     description: Restore the Hive Metastore schema directories from backend database.
# 
#   schematool-info:
#     description: Runs `schematool` with `info` option to display versions.
# 
#   schematool-validate:
#     description: Runs `schematool` with `validate` option to validate the metadata.

storage:
  hive-metastore-warehouse:
    type: filesystem 
    description: Persistent storage for Hive Metastore metadata.
    minimum-size: 100M

containers:
  hive-metastore:
    resource: hive-metastore-image
    mounts:
      - storage: hive-metastore-warehouse
        # TODO (mertalpt): Verify and use
        location: /user/hive/warehouse

resources:
  hive-metastore-image:
    type: oci-image
    description: OCI image built from hive_metastore_rock/rockcraft.yaml for the Hive Metastore service.

requires:
  postgresql:
    interface: postgresql_client
    limit: 1
