# This file configures Charmcraft.
# See https://canonical-charmcraft.readthedocs-hosted.com/en/stable/reference/files/charmcraft-yaml-file/
type: charm
name: hive-metastore-k8s
title: Hive Metastore K8s Operator
summary: Deploy and configure the Apache Hive Metastore on Kubernetes.
description: |
  The Hive Metastore K8s Operator deploys the Hive Metastore using a pre-built
  Hive Metastore rock and integrates with a charmed PostgreSQL database.
  It is designed for integrating with Trino that rely on Hive-compatible metadata
  services running on Kubernetes for certain use cases.

# Documentation:
# https://canonical-charmcraft.readthedocs-hosted.com/en/stable/howto/build-guides/select-platforms/
base: ubuntu@24.04
platforms:
  amd64:


parts:
  charm:
    plugin: charm
    source: .
    prime:
      - "-hive_metastore_rock"
      - "-tests"

charm-libs:
  - lib: data_platform_libs.data_interfaces
    version: "0"
  - lib: data_platform_libs.data_models
    version: "0"

config:
  options:
    log-level:
      description: |
        Configures the Hive Metastore JVM logging level.

        Acceptable values are: "info", "debug", "warning", "error" and "critical"
      default: "info"
      type: string


containers:
  hive-metastore:
    resource: hive-metastore-image


resources:
  hive-metastore-image:
    type: oci-image
    description: OCI image built from rock/rockcraft.yaml for the Hive Metastore service.


requires:
  postgresql:
    interface: postgresql_client
    limit: 1
